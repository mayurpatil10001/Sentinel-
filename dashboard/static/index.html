<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentinel — Market Intelligence</title>
<meta name="description" content="Sentinel market surveillance and manipulation intelligence dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f6f8fb;--surface:#fff;--surface2:#f9fafc;--line:#e8ebf0;--line2:#dfe4eb;
 --text:#172033;--muted:#718096;--muted2:#98a2b3;--green:#00a86b;--green2:#e9f8f2;
 --red:#e5484d;--red2:#fff0f0;--amber:#d98b00;--amber2:#fff7e5;--blue:#356ae6;--blue2:#edf2ff;
 --purple:#7758d9;--shadow:0 8px 28px rgba(21,34,55,.06);--shadow2:0 16px 40px rgba(21,34,55,.10);
 --radius:14px;--nav:238px
}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"DM Sans",system-ui,sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}
.app{height:100vh;display:flex;overflow:hidden}
.sidebar{width:var(--nav);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.brand{height:72px;padding:0 24px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#00b978,#007d55);display:grid;place-items:center;color:white;font-weight:800;box-shadow:0 7px 16px rgba(0,168,107,.22)}
.brand b{font-family:Manrope;font-size:18px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted2);font-size:10px;margin-top:1px}
.nav{padding:18px 12px;overflow:auto}.navlabel{font-size:10px;color:#a1a9b7;text-transform:uppercase;letter-spacing:.12em;font-weight:700;padding:0 12px 8px}
.nav a{height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:10px;color:#697487;text-decoration:none;font-size:13px;font-weight:600;margin:3px 0;transition:.15s}
.nav a:hover{background:#f6f8fb;color:var(--text)}.nav a.active{background:var(--green2);color:#008257}.ico{width:20px;text-align:center;font-size:16px}
.side-bottom{margin-top:auto;padding:16px;border-top:1px solid var(--line)}
.system{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2)}
.system-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}.online{display:flex;gap:6px;align-items:center;color:#16845f;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#16b978;box-shadow:0 0 0 4px #e5f8f1}
.main{min-width:0;flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:72px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:20px;flex:none}
.search{width:360px;height:40px;border:1px solid var(--line);background:#f8fafc;border-radius:10px;display:flex;align-items:center;padding:0 12px;gap:9px;color:var(--muted2)}
.search input{border:0;outline:0;background:transparent;flex:1;font-size:12px;color:var(--text)}
.top-spacer{flex:1}.market-pill{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:9px}
.market-pill b{color:var(--text)}.user{width:34px;height:34px;border-radius:50%;background:#e9eef7;display:grid;place-items:center;font-size:11px;font-weight:800;color:#53617a}
.content{overflow:auto;padding:26px 30px 40px;scroll-behavior:smooth}.page{display:none;max-width:1450px;margin:auto}.page.active{display:block}
.crumb{font-size:11px;color:var(--muted);margin-bottom:6px}.title-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}.title h1{font:800 27px Manrope;margin:0;letter-spacing:-.7px}.title p{margin:5px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px}.btn{border:1px solid var(--line2);background:#fff;border-radius:9px;height:36px;padding:0 13px;color:#566176;font-size:11px;font-weight:700}.btn:hover{border-color:#cbd3df;background:#fafbfd}.btn.primary{background:#009e66;border-color:#009e66;color:#fff}.btn.primary:hover{background:#008c5a}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr)}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:18px 20px}.kpi-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:600}.kpi-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#f0f4fa;color:#5d6a80}.kpi-value{font:800 25px Manrope;letter-spacing:-.5px;margin:12px 0 4px}.change{font-size:10px;font-weight:700}.up{color:#079463}.down{color:#dc4a4f}.neutral{color:var(--muted)}
.section-grid{grid-template-columns:1.55fr .9fr;margin-top:14px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-title{font:700 14px Manrope}.panel-sub{font-size:10px;color:var(--muted);margin-top:3px}.tabs{display:flex;gap:5px}.tab{border:0;background:#f5f7fa;border-radius:7px;color:var(--muted);font-size:10px;font-weight:700;padding:6px 9px}.tab.active{background:#e8f8f2;color:#008458}
.chart{height:260px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.axis{font-size:9px;fill:#a2a9b4}.chart-legend{display:flex;gap:16px;font-size:10px;color:var(--muted);margin-top:3px}.legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.watchlist{margin-top:14px}.watch-row{display:grid;grid-template-columns:1.6fr .75fr .75fr .75fr .6fr;align-items:center;padding:12px 4px;border-top:1px solid var(--line);font-size:11px}.watch-row.head{border:0;color:var(--muted2);font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.symbol{font-weight:800;color:var(--text)}.company{font-size:9px;color:var(--muted);margin-top:2px}.price{font-weight:700}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:800;text-transform:capitalize}.tag.green{background:var(--green2);color:#07845a}.tag.red{background:var(--red2);color:#d53f44}.tag.amber{background:var(--amber2);color:#a66a00}.tag.blue{background:var(--blue2);color:#4264c9}
.alert-list{display:flex;flex-direction:column;gap:8px}.alert-item{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;cursor:pointer;transition:.15s}.alert-item:hover{box-shadow:0 5px 18px rgba(21,34,55,.07);transform:translateY(-1px)}.alert-main{display:flex;justify-content:space-between;gap:8px}.alert-symbol{font-weight:800;font-size:12px}.alert-meta{font-size:9px;color:var(--muted);margin-top:3px}.sev{font-size:8px;font-weight:800;text-transform:uppercase;border-radius:5px;padding:4px 6px}.sev.critical{background:#ffe6e7;color:#c52e34}.sev.high{background:#fff0e3;color:#c66a00}.sev.medium{background:#fff8dc;color:#a77700}.sev.low{background:#edf0f4;color:#697386}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.quick .card{padding:14px}.quick b{font-size:12px}.quick span{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.page-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.input,.select{height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 11px;outline:0;color:var(--text);font-size:11px}.input{min-width:220px}.table-card{overflow:hidden}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:800px}.table th{background:#fafbfd;color:#99a1ae;font-size:9px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:12px 15px;border-bottom:1px solid var(--line)}.table td{padding:13px 15px;border-bottom:1px solid #f0f2f5;font-size:11px;color:#536075}.table tr:last-child td{border-bottom:0}.table tr.click:hover td{background:#fbfcfe;cursor:pointer}.table strong{color:var(--text)}
.detail{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.detail-box{padding:20px}.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:13px}.metric label{display:block;color:var(--muted);font-size:9px;margin-bottom:6px}.metric b{font:700 16px Manrope}.drawer{position:fixed;inset:0;background:rgba(14,22,35,.25);display:none;z-index:20}.drawer.open{display:block}.drawer-panel{position:absolute;right:0;top:0;height:100%;width:min(560px,100%);background:#fff;box-shadow:-18px 0 50px rgba(15,30,50,.14);padding:25px;overflow:auto}.close{float:right;border:0;background:#f2f4f7;border-radius:8px;width:30px;height:30px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.65}.empty{text-align:center;padding:40px;color:var(--muted);font-size:12px}.loader{padding:35px;text-align:center;color:var(--muted);font-size:11px}.notice{padding:11px 13px;border-radius:9px;background:#f7f9fc;border:1px solid var(--line);font-size:10px;color:var(--muted);line-height:1.6}
.footer-note{font-size:9px;color:#9aa3b1;margin-top:18px;text-align:center}
@media(max-width:1000px){.sidebar{width:76px}.brand{justify-content:center;padding:0}.brand-text,.navlabel,.nav a span:not(.ico),.system{display:none}.nav a{justify-content:center;padding:0}.kpis{grid-template-columns:repeat(2,1fr)}.section-grid,.detail{grid-template-columns:1fr}.search{width:250px}}
@media(max-width:650px){.sidebar{display:none}.topbar{padding:0 14px}.content{padding:18px 14px}.search{width:auto;flex:1}.market-pill{display:none}.kpis{grid-template-columns:1fr}.title-row{align-items:flex-start;gap:12px;flex-direction:column}.quick{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">S</div><div class="brand-text"><b>Sentinel</b><small>Market Intelligence</small></div></div>
  <nav class="nav">
    <div class="navlabel">Workspace</div>
    <a href="#home" data-page="home" class="active"><i class="ico">⌂</i><span>Overview</span></a>
    <a href="#watchlist" data-page="watchlist"><i class="ico">☆</i><span>Watchlist</span></a>
    <a href="#alerts" data-page="alerts"><i class="ico">◈</i><span>Alerts</span></a>
    <a href="#instruments" data-page="instruments"><i class="ico">▦</i><span>Instruments</span></a>
    <div class="navlabel" style="margin-top:16px">Intelligence</div>
    <a href="#backtest" data-page="backtest"><i class="ico">◒</i><span>Backtests</span></a>
    <a href="#sources" data-page="sources"><i class="ico">◉</i><span>Data sources</span></a>
    <a href="#system" data-page="system"><i class="ico">⚙</i><span>System health</span></a>
  </nav>
  <div class="side-bottom"><div class="system"><div class="system-row"><span>Surveillance engine</span><span class="online"><i class="dot"></i>Live</span></div><div class="system-row" style="margin-top:8px"><span>API</span><span id="apiStatus">Checking…</span></div></div></div>
</aside>
<main class="main">
<header class="topbar">
  <div class="search">⌕ <input id="globalSearch" placeholder="Search symbol, alert or instrument…" /></div>
  <div class="top-spacer"></div>
  <div class="market-pill"><span>Market status</span><b><i class="dot" style="display:inline-block;margin-right:7px"></i>Connected</b></div>
  <div class="user">HS</div>
</header>
<section class="content">
  <div id="page-home" class="page active"></div>
  <div id="page-watchlist" class="page"></div>
  <div id="page-alerts" class="page"></div>
  <div id="page-instruments" class="page"></div>
  <div id="page-backtest" class="page"></div>
  <div id="page-sources" class="page"></div>
  <div id="page-system" class="page"></div>
</section>
</main>
</div>
<div id="drawer" class="drawer"><div class="drawer-panel"><button class="close" onclick="closeDrawer()">×</button><div id="drawerBody"></div></div></div>
<script>
const API='/api';
const state={instruments:[],alerts:[],page:'home'};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>v==null?'—':'₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:2});
const timeAgo=v=>{if(!v)return'—';let d=new Date(v),m=Math.max(0,Math.round((Date.now()-d)/60000));return m<1?'Just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};
async function api(path,opts={}){let r=await fetch(API+path,opts);if(!r.ok)throw new Error((await r.text()).slice(0,240));return r.json()}
function sev(s){return `<span class="sev ${esc(s||'low')}">${esc(s||'low')}</span>`}
function shell(title,sub,actions=''){return `<div class="crumb">Sentinel / ${title}</div><div class="title-row"><div class="title"><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function empty(t='No records found'){return `<div class="empty">${t}</div>`}
function spark(seed=1){let pts=[],y=58;for(let i=0;i<32;i++){y+=Math.sin(i*seed*.5)*3+(Math.random()-.47)*4;y=Math.max(18,Math.min(100,y));pts.push([i,y])}return pts.map((p,i)=>(i?'L':'M')+`${p[0]*3.2},${p[1]}`).join(' ')}
function chartSvg(){return `<svg viewBox="0 0 1024 120" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#00a86b" stop-opacity=".18"/><stop offset="1" stop-color="#00a86b" stop-opacity="0"/></linearGradient></defs><path d="${spark(.83)} L102,120 L0,120Z" fill="url(#fill)" transform="translate(0,-10) scale(1,1.05)"/><path d="${spark(.83)}" fill="none" stroke="#00a86b" stroke-width="2.2" transform="translate(0,-10) scale(1,1.05)"/><line x1="0" y1="92" x2="1024" y2="92" stroke="#eef1f4"/><line x1="0" y1="60" x2="1024" y2="60" stroke="#eef1f4"/></svg>`}
async function loadCore(){try{state.instruments=await api('/instruments');document.getElementById('apiStatus').textContent='Connected';document.getElementById('apiStatus').style.color='#16845f'}catch(e){document.getElementById('apiStatus').textContent='Offline';document.getElementById('apiStatus').style.color='#d54b50'}try{state.alerts=(await api('/alerts?page=1&page_size=100')).items||[]}catch(e){state.alerts=[]}}
function home(){
 const high=state.alerts.filter(a=>['critical','high'].includes(a.severity)).length, open=state.alerts.filter(a=>['open','investigating'].includes(a.status)).length;
 const flagged=state.instruments.filter(i=>i.open_alert_count>0).length;
 const watch=state.instruments.slice(0,7);
 return shell('Overview','A clean, real-time view of market surveillance activity.',`<button class="btn" onclick="loadCore().then(render)">↻ Refresh</button><button class="btn primary" onclick="location.hash='alerts'">Review alerts</button>`)
 +`<div class="grid kpis">
  <div class="card kpi"><div class="kpi-top"><span>Open alerts</span><span class="kpi-icon">◈</span></div><div class="kpi-value">${open}</div><div class="change ${open?'down':'up'}">${open?'Needs review':'All clear'} <span class="neutral">· current queue</span></div></div>
  <div class="card kpi"><div class="kpi-top"><span>High priority</span><span class="kpi-icon">!</span></div><div class="kpi-value">${high}</div><div class="change ${high?'down':'up'}">${high?'Active surveillance signals':'No high-severity signals'}</div></div>
  <div class="card kpi"><div class="kpi-top"><span>Monitored instruments</span><span class="kpi-icon">▦</span></div><div class="kpi-value">${state.instruments.length}</div><div class="change up">${flagged} currently flagged</div></div>
  <div class="card kpi"><div class="kpi-top"><span>Detection coverage</span><span class="kpi-icon">◎</span></div><div class="kpi-value">6</div><div class="change up">Surveillance engines online</div></div>
 </div>
 <div class="grid section-grid">
  <div class="card panel"><div class="panel-head"><div><div class="panel-title">Surveillance activity</div><div class="panel-sub">Signal intensity across the current monitoring window</div></div><div class="tabs"><button class="tab active">1D</button><button class="tab">1W</button><button class="tab">1M</button></div></div><div class="chart">${chartSvg()}</div><div class="chart-legend"><span><i class="legend-dot" style="background:#00a86b"></i>Signal index</span><span>Updated ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></div></div>
  <div class="card panel"><div class="panel-head"><div><div class="panel-title">Priority alerts</div><div class="panel-sub">Requires analyst attention</div></div><button class="btn" onclick="location.hash='alerts'">View all</button></div><div class="alert-list">${state.alerts.filter(a=>['critical','high','medium'].includes(a.severity)).slice(0,5).map(alertItem).join('')||empty('No active alerts')}</div></div>
 </div>
 <div class="card panel watchlist"><div class="panel-head"><div><div class="panel-title">Market watchlist</div><div class="panel-sub">Instruments with the latest surveillance state</div></div><button class="btn" onclick="location.hash='watchlist'">Open watchlist</button></div>
 <div class="watch-row head"><span>Instrument</span><span>Exchange</span><span>Avg volume</span><span>Status</span><span>Alerts</span></div>
 ${watch.map(i=>`<div class="watch-row" onclick="openInstrument('${esc(i.id)}')"><div><div class="symbol">${esc(i.symbol)}</div><div class="company">${esc(i.instrument_type||'Equity')}</div></div><span>${esc(i.exchange)}</span><span>${i.avg_daily_volume_30d?Number(i.avg_daily_volume_30d).toLocaleString('en-IN'):'—'}</span><span>${i.last_alert_severity?sev(i.last_alert_severity):'<span class="tag green">Clean</span>'}</span><b>${i.open_alert_count||0}</b></div>`).join('')||empty('No instruments loaded')}</div>
 </div>
 <div class="quick"><div class="card"><b>Evidence-first detection</b><span>Every alert can be opened for explainability, status history and evidence context.</span></div><div class="card"><b>SEBI workflow</b><span>Generate a draft SAR from an alert for analyst review before filing.</span></div><div class="card"><b>Research mode</b><span>Use backtests and data-source health to validate surveillance coverage.</span></div></div>
 <div class="footer-note">Research / proof-of-concept interface · Outputs are surveillance signals, not legal determinations or investment advice.</div>`;
}
function alertItem(a){return `<div class="alert-item" onclick="openAlert('${esc(a.id)}')"><div class="alert-main"><div><div class="alert-symbol">${esc(a.instrument_symbol)} <span style="font-weight:500;color:#8590a0">· ${esc(a.pattern_type)}</span></div><div class="alert-meta">${timeAgo(a.window_end||a.window_start)} · score ${a.score==null?'—':Number(a.score).toFixed(2)}</div></div>${sev(a.severity)}</div></div>`}
async function renderWatchlist(){let list=state.instruments;document.getElementById('page-watchlist').innerHTML=shell('Watchlist','Monitor instruments and their current surveillance state.',`<button class="btn" onclick="loadCore().then(render)">↻ Refresh</button>`)+`<div class="card table-card"><div class="page-toolbar" style="padding:16px 16px 0"><input class="input" id="wlSearch" placeholder="Search symbol or exchange…" oninput="filterWatch()"><select class="select" id="wlSeverity" onchange="filterWatch()"><option value="">All states</option><option>critical</option><option>high</option><option>medium</option><option>Clean</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Instrument</th><th>Exchange</th><th>Type</th><th>Avg daily volume</th><th>Alert state</th><th>Open</th></tr></thead><tbody id="wlBody">${list.map(i=>watchTr(i)).join('')||`<tr><td colspan="6">${empty()}</td></tr>`}</tbody></table></div></div>`}
function watchTr(i){return `<tr class="click" onclick="openInstrument('${esc(i.id)}')"><td><strong>${esc(i.symbol)}</strong><div style="font-size:9px;color:#9aa2ae">${esc(i.underlying_symbol||'')}</div></td><td>${esc(i.exchange)}</td><td>${esc(i.instrument_type)}</td><td>${i.avg_daily_volume_30d?Number(i.avg_daily_volume_30d).toLocaleString('en-IN'):'—'}</td><td>${i.last_alert_severity?sev(i.last_alert_severity):'<span class="tag green">Clean</span>'}</td><td>${i.open_alert_count||0}</td></tr>`}
function filterWatch(){let q=(document.getElementById('wlSearch')?.value||'').toLowerCase(),s=document.getElementById('wlSeverity')?.value;let a=state.instruments.filter(i=>(!q||(i.symbol+i.exchange).toLowerCase().includes(q))&&(!s||(s==='Clean'?!i.last_alert_severity:i.last_alert_severity===s)));document.getElementById('wlBody').innerHTML=a.map(watchTr).join('')||`<tr><td colspan="6">${empty()}</td></tr>`}
function alertsPage(){document.getElementById('page-alerts').innerHTML=shell('Alerts','Review, investigate and escalate detected market signals.',`<button class="btn" onclick="loadCore().then(render)">↻ Refresh</button>`)+`<div class="card table-card"><div class="page-toolbar" style="padding:16px 16px 0"><input class="input" id="alSearch" placeholder="Search symbol or pattern…" oninput="filterAlerts()"><select class="select" id="alSev" onchange="filterAlerts()"><option value="">Severity</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select><select class="select" id="alStatus" onchange="filterAlerts()"><option value="">Status</option><option>open</option><option>investigating</option><option>escalated</option><option>closed</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Instrument</th><th>Pattern</th><th>Severity</th><th>Score</th><th>Status</th><th>Window</th></tr></thead><tbody id="alBody">${state.alerts.map(alertTr).join('')||`<tr><td colspan="6">${empty('No alerts in the current dataset')}</td></tr>`}</tbody></table></div></div>`}
function alertTr(a){return `<tr class="click" onclick="openAlert('${esc(a.id)}')"><td><strong>${esc(a.instrument_symbol)}</strong><div style="font-size:9px;color:#9aa2ae">${esc(a.exchange)}</div></td><td>${esc(a.pattern_type)}</td><td>${sev(a.severity)}</td><td>${a.score==null?'—':Number(a.score).toFixed(3)}</td><td><span class="tag ${a.status==='closed'?'green':a.status==='escalated'?'blue':'amber'}">${esc(a.status)}</span></td><td>${timeAgo(a.window_end||a.window_start)}</td></tr>`}
function filterAlerts(){let q=(document.getElementById('alSearch')?.value||'').toLowerCase(),s=document.getElementById('alSev')?.value,st=document.getElementById('alStatus')?.value;let a=state.alerts.filter(x=>(!q||(x.instrument_symbol+x.pattern_type).toLowerCase().includes(q))&&(!s||x.severity===s)&&(!st||x.status===st));document.getElementById('alBody').innerHTML=a.map(alertTr).join('')||`<tr><td colspan="6">${empty('No matching alerts')}</td></tr>`}
async function openAlert(id){try{let a=await api('/alerts/'+encodeURIComponent(id));document.getElementById('drawerBody').innerHTML=`<div class="crumb">Alert detail</div><h2 style="font:800 23px Manrope;margin:0 0 5px">${esc(a.instrument_symbol)}</h2><div style="color:#7b8697;font-size:11px;margin-bottom:18px">${esc(a.exchange)} · ${esc(a.pattern_type)}</div><div class="metric-grid"><div class="metric"><label>Severity</label>${sev(a.severity)}</div><div class="metric"><label>Detection score</label><b>${a.score==null?'—':Number(a.score).toFixed(4)}</b></div><div class="metric"><label>Status</label><b style="font-size:12px">${esc(a.status)}</b></div><div class="metric"><label>Accounts involved</label><b>${a.accounts_involved??'—'}</b></div></div><h3 style="margin:24px 0 8px;font:700 13px Manrope">Why this was flagged</h3><div class="notice">${esc(a.explanation||'No explanation provided.')}</div><h3 style="margin:24px 0 8px;font:700 13px Manrope">Workflow</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="changeStatus('${esc(a.id)}','investigating')">Investigate</button><button class="btn" onclick="changeStatus('${esc(a.id)}','closed')">Close</button><button class="btn primary" onclick="makeSar('${esc(a.id)}')">Generate SEBI draft</button></div><div id="drawerMsg" style="margin-top:15px"></div>`;document.getElementById('drawer').classList.add('open')}catch(e){alert(e.message)}}
async function changeStatus(id,status){try{await api('/alerts/'+encodeURIComponent(id)+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_status:status,notes:'Updated from Sentinel dashboard'})});document.getElementById('drawerMsg').innerHTML='<div class="notice">Status updated successfully.</div>';await loadCore()}catch(e){document.getElementById('drawerMsg').innerHTML='<div class="notice" style="color:#c33">'+esc(e.message)+'</div>'}}
async function makeSar(id){let el=document.getElementById('drawerMsg');el.innerHTML='<div class="notice">Generating draft…</div>';try{let d=await api('/alerts/'+encodeURIComponent(id)+'/escalate-to-sebi',{method:'POST'});el.innerHTML='<div class="notice"><b>Draft generated.</b><pre class="mono" style="white-space:pre-wrap;max-height:280px;overflow:auto;margin-top:9px">'+esc(d.plain_text||JSON.stringify(d,null,2))+'</pre></div>'}catch(e){el.innerHTML='<div class="notice" style="color:#c33">'+esc(e.message)+'</div>'}}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
async function openInstrument(id){try{let i=await api('/instruments/'+encodeURIComponent(id));document.getElementById('drawerBody').innerHTML=`<div class="crumb">Instrument</div><h2 style="font:800 23px Manrope;margin:0">${esc(i.symbol)}</h2><div style="font-size:11px;color:#7b8697;margin:5px 0 20px">${esc(i.exchange)} · ${esc(i.instrument_type)}</div><div class="metric-grid"><div class="metric"><label>Average daily volume</label><b>${i.avg_daily_volume_30d?Number(i.avg_daily_volume_30d).toLocaleString('en-IN'):'—'}</b></div><div class="metric"><label>Average order size</label><b>${money(i.avg_order_size_30d)}</b></div><div class="metric"><label>Average turnover</label><b>${money(i.avg_daily_turnover_30d)}</b></div><div class="metric"><label>Open alerts</label><b>${i.open_alert_count||0}</b></div></div><h3 style="margin:24px 0 8px;font:700 13px Manrope">Surveillance state</h3>${i.last_alert_severity?sev(i.last_alert_severity):'<span class="tag green">No recent alert</span>'}<div class="notice" style="margin-top:18px">Instrument detail is read from the Sentinel surveillance database. No trading or order placement action is available from this interface.</div>`;document.getElementById('drawer').classList.add('open')}catch(e){alert(e.message)}}
async function backtestPage(){document.getElementById('page-backtest').innerHTML=shell('Backtests','Historical validation and detector performance evidence.')+'<div id="btBox" class="card panel"><div class="loader">Loading backtest results…</div></div>';try{let d=await api('/backtest/results');document.getElementById('btBox').innerHTML=`<div class="panel-head"><div><div class="panel-title">Backtest results</div><div class="panel-sub">Stored research outputs available in the repository</div></div></div><pre class="mono" style="white-space:pre-wrap;max-height:520px;overflow:auto">${esc(JSON.stringify(d,null,2))}</pre>`}catch(e){document.getElementById('btBox').innerHTML='<div class="notice">Backtest endpoint unavailable or no results are stored.</div>'}}
async function sourcesPage(){document.getElementById('page-sources').innerHTML=shell('Data sources','Health and provenance of the surveillance input layer.')+'<div id="srcBox" class="card panel"><div class="loader">Loading source status…</div></div>';try{let d=await api('/system/data-sources');document.getElementById('srcBox').innerHTML=`<div class="panel-head"><div><div class="panel-title">Source registry</div></div></div><pre class="mono" style="white-space:pre-wrap;max-height:600px;overflow:auto">${esc(JSON.stringify(d,null,2))}</pre>`}catch(e){document.getElementById('srcBox').innerHTML='<div class="notice">Data-source endpoint unavailable.</div>'}}
async function systemPage(){document.getElementById('page-system').innerHTML=shell('System health','Operational status of the Sentinel detection stack.')+'<div id="sysBox" class="card panel"><div class="loader">Checking system…</div></div>';try{let [d,h]=await Promise.all([api('/system/detector-status'),api('/system/engineering-health')]);document.getElementById('sysBox').innerHTML=`<div class="panel-head"><div><div class="panel-title">Engine status</div><div class="panel-sub">Detection services and engineering checks</div></div><span class="tag green">Online</span></div><div class="notice" style="margin-bottom:14px"><pre class="mono" style="white-space:pre-wrap">${esc(JSON.stringify(d,null,2))}</pre></div><div class="notice"><pre class="mono" style="white-space:pre-wrap;max-height:420px;overflow:auto">${esc(JSON.stringify(h,null,2))}</pre></div>`}catch(e){document.getElementById('sysBox').innerHTML='<div class="notice">System health endpoint unavailable.</div>'}}
async function instrumentsPage(){document.getElementById('page-instruments').innerHTML=shell('Instruments','All instruments currently known to Sentinel.')+`<div class="card table-card"><div class="table-wrap"><table class="table"><thead><tr><th>Symbol</th><th>Exchange</th><th>Type</th><th>Underlying</th><th>30D volume</th><th>State</th></tr></thead><tbody>${state.instruments.map(i=>`<tr class="click" onclick="openInstrument('${esc(i.id)}')"><td><strong>${esc(i.symbol)}</strong></td><td>${esc(i.exchange)}</td><td>${esc(i.instrument_type)}</td><td>${esc(i.underlying_symbol||'—')}</td><td>${i.avg_daily_volume_30d?Number(i.avg_daily_volume_30d).toLocaleString('en-IN'):'—'}</td><td>${i.last_alert_severity?sev(i.last_alert_severity):'<span class="tag green">Clean</span>'}</td></tr>`).join('')||`<tr><td colspan="6">${empty()}</td></tr>`}</tbody></table></div></div>`}
function render(){document.getElementById('page-home').innerHTML=home();renderWatchlist();alertsPage();instrumentsPage();backtestPage();sourcesPage();systemPage()}
function route(){let p=(location.hash||'#home').slice(1);if(!document.getElementById('page-'+p))p='home';state.page=p;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===p))}
window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.trim().toLowerCase();let i=state.instruments.find(x=>x.symbol.toLowerCase().includes(q));let a=state.alerts.find(x=>x.instrument_symbol.toLowerCase().includes(q));if(i)openInstrument(i.id);else if(a)openAlert(a.id)}})
(async()=>{await loadCore();render();route()})();
</script>
</body>
</html>
